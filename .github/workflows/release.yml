# .github/workflows/release.yml
# Phase 12.2 — build the app image and push it to ECR, triggered by a version tag.
# Auth is OIDC: no AWS keys stored in GitHub. The role + trust live in infra/08-github-oidc.tf.
#
# Build flow (LEARNING — trigger on main push):
#   git push origin main  →  build+push eks-dev/app:0.0.<run_number>  →  bump the tag in the
#   CONFIG repo (ssp-exchange-helm)  →  Argo CD syncs → deploys. Git stays the source of truth.
#   (Chosen over Argo CD Image Updater: simpler, immediate, and CI already knows the exact tag.)

name: release

on:
  push:
    branches:
      - main # LEARNING: run on every push to main. Requires the IAM trust to allow refs/heads/main.
  # Adds the "Run workflow" button in the Actions tab (and `gh workflow run`). The ref you pick
  # there becomes github.ref_name AND the OIDC sub — so only main / v* tags pass the IAM trust.
  workflow_dispatch:

# Never run two releases for the same tag at once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Least privilege. id-token:write is what lets the job mint the GitHub OIDC JWT; without it,
# assuming the AWS role fails. contents:read is just for checkout. Nothing else is granted.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: eks-dev/app # matches aws_ecr_repository.app  ("${cluster_name}/app")

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Exchanges the OIDC token for ~1h AWS creds by calling AssumeRoleWithWebIdentity.
      # AWS_ROLE_ARN is a repo VARIABLE (not a secret — the ARN isn't sensitive):
      #   Settings → Secrets and variables → Actions → Variables → AWS_ROLE_ARN
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # docker login to ECR with those temp creds. Calls ecr:GetAuthorizationToken (the one
      # account-wide permission) and outputs the registry host for the build step.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Incremental version per build: github.run_number is a monotonic counter for this workflow,
      # so each push to main produces a unique tag (0.0.1, 0.0.2, …). Works with the IMMUTABLE ECR
      # repo (a tag is never re-pushed) and with GitOps (a new tag = a real diff Argo CD can sync).
      # Bump the "0.0." base by hand for a minor/major; run_number drives the patch number.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: 0.0.${{ github.run_number }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$VERSION"
          echo "Building $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "::notice title=Pushed::$IMAGE"

  # After the image is in ECR, record the new tag in the CONFIG repo so Argo CD deploys it.
  # This is the "push the tag to git" half of GitOps — no in-cluster controller involved.
  bump-config:
    needs: build-push # only run if the image was built + pushed successfully
    runs-on: ubuntu-latest
    steps:
      # Check out a DIFFERENT repo (the config repo). GITHUB_TOKEN can't reach another repo, so we
      # authenticate with the deploy key's PRIVATE half, stored as the app-repo secret
      # CONFIG_REPO_DEPLOY_KEY. Its PUBLIC half is a write-enabled Deploy Key on ssp-exchange-helm.
      # `ssh-key` also stays configured for the git push below (persist-credentials defaults to true).
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: AlexanderMinko/ssp-exchange-helm
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}

      # Set exchange.image.tag to the tag we just pushed, then commit. Argo CD (watching this repo)
      # detects the commit and syncs. `yq` is preinstalled on ubuntu-latest runners.
      - name: Bump exchange image tag and commit
        env:
          VERSION: 0.0.${{ github.run_number }} # same value the build job used (per-run counter)
        run: |
          yq -i ".exchange.image.tag = \"${VERSION}\"" charts/exchange/values.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/exchange/values.yaml
          git commit -m "deploy: exchange ${VERSION}" || { echo "nothing to commit"; exit 0; }
          git push
