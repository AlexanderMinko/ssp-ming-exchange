# Local MongoDB for the exchange. Seeding is done by the app itself at startup (ConfigSeeder),
# so there's no separate seed container. Run the app with `./mvnw spring-boot:run` and it will
# create the baseline config in this Mongo on boot.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

volumes:
  mongo-data:
