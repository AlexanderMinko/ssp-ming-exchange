spring:
  application:
    name: exchange
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOSTS}/${MONGO_DATABASE_NAME:ssp-exchange}${MONGO_PARAMS:?authSource=admin}

exchange:
  config-refresh-ms: ${EXCHANGE_CONFIG_REFRESH_MS:30000}
  bidder:
    # No default on purpose: a key missing from the chart's ConfigMap must fail startup, not call localhost.
    # Local value lives in application-local.yaml (SPRING_PROFILES_ACTIVE=local).
    base-url: ${BIDDERS_BASE_URL}
    connect-timeout-ms: ${EXCHANGE_BIDDER_CONNECT_TIMEOUT_MS:100}
    # Must be >= the largest bidder window: BidderService clamps tmax to 450, minus 50 overhead = 400 ms. A late
    # call still finishes and keeps its connection (never cancelled, like ssp-backend); only a hung bidder is cut.
    # Raise MAX_TMAX_MS and this together.
    read-timeout-ms: ${EXCHANGE_BIDDER_READ_TIMEOUT_MS:400}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
  # Histogram buckets for http_server_requests (the `_bucket` series), so p99 comes from
  # histogram_quantile() and aggregates across pods. With the `slo` boundaries it costs about 80 series per uri/method/status per pod.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: ${HTTP_SERVER_HISTOGRAM_ENABLED:true}
      # Extra exact bucket boundaries, added to the generated ladder (not replacing it). The ladder has no boundary
      # between 268 and 358 ms, so p95/p99 there were interpolated across one 89 ms bucket and overestimated (p99
      # 350 ms above a real max of 348 ms, 24/11/2026). 250/300/350 ms are the auction deadlines (tmax - 50 for
      # tmax 300/350/400): requests over a deadline are now an exact count, e.g. 1 - bucket{le="0.3"} / bucket{le="+Inf"}.
      slo:
        http.server.requests: 25ms,50ms,100ms,200ms,250ms,300ms,350ms,500ms
  # OTLP_ENDPOINT has no default (a location): the chart sets the SigNoz collector, application-local.yaml
  # sets localhost. One base URL for both signals; metrics push stays off (metrics are pulled).
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_ENDPOINT}/v1/metrics
  # Boot 4 names. The old management.tracing.enabled / management.otlp.tracing.endpoint are deprecated at
  # level `error` (no longer bound): with them, trace export would be ON by default (Boot's default true).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT}/v1/traces
  tracing:
    export:
      # Must stay true: Boot creates the W3C propagator only under this global switch. With it false, no
      # traceparent is read or sent and every service mints its own trace id (found 21/11/2026).
      enabled: true
      otlp:
        enabled: ${TRACING_ENABLED:true} # only whether spans are SENT to SigNoz
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
