spring:
  application:
    name: exchange
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOSTS}/${MONGO_DATABASE_NAME:ssp-exchange}${MONGO_PARAMS:?authSource=admin}

exchange:
  config-refresh-ms: ${EXCHANGE_CONFIG_REFRESH_MS:30000}
  bidder:
    base-url: ${BIDDERS_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${EXCHANGE_BIDDER_CONNECT_TIMEOUT_MS:100}
    read-timeout-ms: ${EXCHANGE_BIDDER_READ_TIMEOUT_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,metrics}
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
