# Laptop-only values. Activate with SPRING_PROFILES_ACTIVE=local (IntelliJ: Active profiles = local).
# Rule: WHERE things live (hosts, URLs) has no default in application.yaml — the cluster value comes from
# the Helm chart's ConfigMap, the laptop value from here. Tuning knobs (timeouts, toggles) keep defaults there.
spring:
  mongodb:
    uri: mongodb://localhost:27017/ssp-exchange # the exchange repo's docker-compose Mongo, no auth

exchange:
  bidder:
    base-url: http://localhost:8081 # bidders started with its own `local` profile

# Logs are not pushed: the local profile writes JSON lines to ~/.ssp-ming/logs/exchange.json (logback-spring.xml),
# and the local SigNoz ingester tails that file, as the agent tails stdout on EKS.
# Traces (TRACING_ENABLED=true) and the unused metrics push go to the local SigNoz (ingester on :4318).
management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
